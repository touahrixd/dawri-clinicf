<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>لوحة دوري — إدارة الأدوار للعيادة</title>
    <meta name="description" content="نظام إدارة أدوار المرضى للعيادات" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/assets/index-egIjzhA5.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CyGRkLFq.css">

    <style>
      /* ── صفحة التنشيط ── */
      #activationOverlay {
        position: fixed; inset: 0; z-index: 100000;
        background: linear-gradient(135deg, #0f766e, #059669);
        display: flex; align-items: center; justify-content: center;
        font-family: 'Tajawal', system-ui, sans-serif; padding: 20px;
      }
      #activationOverlay.hidden { display: none !important; }
      .act-card { background: #fff; border-radius: 24px; padding: 36px 28px; width: min(440px, 95vw); text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,.15); }
      .act-card h2 { font-size: 22px; font-weight: 800; color: #0f766e; margin-bottom: 4px; }
      .act-card .sub { color: #64748b; margin-bottom: 24px; font-size: 14px; }
      .act-card .field { margin-bottom: 12px; text-align: right; }
      .act-card .field label { display: block; font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 4px; }
      .act-card input { width: 100%; padding: 11px 14px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 15px; font-family: inherit; outline: none; }
      .act-card input:focus { border-color: #0f766e; }
      .act-card .btn-act { width: 100%; padding: 13px; background: linear-gradient(135deg, #0f766e, #059669); color: #fff; border: none; border-radius: 12px; font-size: 17px; font-weight: 700; font-family: inherit; cursor: pointer; }
      .act-card .btn-act:hover { opacity: .9; }
      .act-card .btn-act:disabled { opacity: .5; }
      .act-card .err { color: #ef4444; font-size: 13px; margin-top: 8px; min-height: 18px; }
      .act-card .ok { color: #059669; font-size: 14px; margin-top: 10px; font-weight: 600; }
      .act-card .skip { background: none; border: none; color: #94a3b8; font-size: 13px; cursor: pointer; margin-top: 14px; font-family: inherit; }

      /* ── شريط العيادة ── */
      #clinicTopBar {
        display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
        background: linear-gradient(135deg, #0f766e, #059669); color: #fff;
        padding: 10px 20px; font-family: 'Tajawal', system-ui, sans-serif;
        display: none; align-items: center; justify-content: space-between;
      }
      #clinicTopBar.visible { display: flex; }
      #clinicTopBar .name { font-size: 16px; font-weight: 700; }
      #clinicTopBar .tag { font-size: 12px; opacity: .85; }
      #clinicTopBar button { background: rgba(255,255,255,.2); color: #fff; border: none; padding: 6px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; font-family: inherit; }
    </style>
  </head>
  <body>
    <!-- شريط اسم العيادة (يظهر بعد التنشيط) -->
    <div id="clinicTopBar">
      <div><div class="name" id="barName"></div><div class="tag" id="barTag"></div></div>
      <button onclick="deactivate()">تسجيل خروج</button>
    </div>

    <!-- صفحة التنشيط -->
    <div id="activationOverlay">
      <div class="act-card">
        <h2>🏥 تفعيل لوحة العيادة</h2>
        <div class="sub">أدخل كود التفعيل الذي تلقيته من إدارة دوري</div>
        <div class="field"><label>كود التفعيل</label><input id="actCode" placeholder="A4F4D3-A6BEB5" style="letter-spacing:2px;text-align:center"/></div>
        <div class="field"><label>اسم العيادة</label><input id="actName" placeholder="عيادة الشفاء الطبية"/></div>
        <div class="field"><label>الشعار (اختياري)</label><input id="actTag" placeholder="صحتك أولوية"/></div>
        <div class="field"><label>كلمة المرور (4+ حروف)</label><input id="actPass" type="password" placeholder="اختر كلمة مرور"/></div>
        <div class="field"><label>تأكيد كلمة المرور</label><input id="actPass2" type="password" placeholder="أعد إدخال كلمة المرور"/></div>
        <button class="btn-act" onclick="doActivate()">✅ تفعيل</button>
        <div class="err" id="actErr"></div>
        <div class="ok" id="actOk"></div>
        <button class="skip" onclick="enterWithoutActivation()">الدخول بدون تنشيط (تجريبي)</button>
      </div>
    </div>

    <div id="root"></div>

    <script type="module">
      const API = location.origin + '/api';
      const overlay = document.getElementById('activationOverlay');
      const topBar = document.getElementById('clinicTopBar');

      /* ── التحقق من الحالة ── */
      const clinicToken = localStorage.getItem('clinicToken');
      const clinicId = localStorage.getItem('clinicId');
      const clinicName = localStorage.getItem('clinicName');

      if (clinicToken && clinicId && clinicName) {
        /* مسبقاً مُنشّط — إخفاء صفحة التنشيط وإظهار الشريط */
        overlay.classList.add('hidden');
        showTopBar(clinicName, localStorage.getItem('clinicTagline') || '');
        interceptFetch(clinicToken);
      }

      function showTopBar(name, tag) {
        document.getElementById('barName').textContent = name;
        document.getElementById('barTag').textContent = tag;
        topBar.classList.add('visible');
        document.body.style.paddingTop = '52px';
      }

      /* ── اعتراض fetch لإرسال توكن العيادة ── */
      function interceptFetch(token) {
        const origFetch = window.fetch;
        window.fetch = function(url, opts = {}) {
          if (typeof url === 'string' && url.startsWith('/api/')) {
            opts.headers = { ...opts.headers, 'Authorization': 'Bearer ' + token };
          }
          return origFetch.call(this, url, opts);
        };
      }

      /* ── التنشيط ── */
      window.doActivate = async function() {
        const code = document.getElementById('actCode').value.trim();
        const name = document.getElementById('actName').value.trim();
        const tag = document.getElementById('actTag').value.trim();
        const pass = document.getElementById('actPass').value;
        const pass2 = document.getElementById('actPass2').value;
        const errEl = document.getElementById('actErr');
        const okEl = document.getElementById('actOk');

        if (!code) { errEl.textContent = 'كود التفعيل مطلوب'; return; }
        if (!name) { errEl.textContent = 'اسم العيادة مطلوب'; return; }
        if (pass.length < 4) { errEl.textContent = 'كلمة المرور 4+ حروف'; return; }
        if (pass !== pass2) { errEl.textContent = 'كلمتا المرور غير متطابقتين'; return; }

        try {
          const r = await fetch(API + '/clinic/activate', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ activationCode: code, password: pass, clinicName: name, tagline: tag }),
          });
          const d = await r.json();
          if (!r.ok) { errEl.textContent = d.error; return; }

          localStorage.setItem('clinicToken', d.token);
          localStorage.setItem('clinicId', d.clinicId);
          localStorage.setItem('clinicName', d.name || name);
          localStorage.setItem('clinicTagline', tag);

          okEl.textContent = '✅ تم التفعيل! جاري التحميل...';
          errEl.textContent = '';

          setTimeout(() => {
            overlay.classList.add('hidden');
            showTopBar(d.name || name, tag);
            interceptFetch(d.token);
          }, 1000);
        } catch { errEl.textContent = 'خطأ في الاتصال بالسيرفر'; }
      };

      window.enterWithoutActivation = function() {
        overlay.classList.add('hidden');
        document.body.style.paddingTop = '0';
      };

      window.deactivate = function() {
        localStorage.removeItem('clinicToken');
        localStorage.removeItem('clinicId');
        localStorage.removeItem('clinicName');
        localStorage.removeItem('clinicTagline');
        topBar.classList.remove('visible');
        document.body.style.paddingTop = '0';
        overlay.classList.remove('hidden');
      };

      /* ── Enter key ── */
      document.getElementById('actPass2')?.addEventListener('keydown', e => { if (e.key === 'Enter') doActivate(); });
    </script>
  </body>
</html>
