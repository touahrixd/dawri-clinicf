<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>لوحة دوري — إدارة الأدوار للعيادة</title>
    <meta name="description" content="نظام إدارة أدوار المرضى للعيادات" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/assets/index-egIjzhA5.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CyGRkLFq.css">
    <style>
      #clinicTopBar { display:none; position:fixed; top:0; left:0; right:0; z-index:9999; background:linear-gradient(135deg,#0f766e,#059669); color:#fff; padding:10px 20px; font-family:'Tajawal',system-ui,sans-serif; align-items:center; justify-content:space-between; }
      #clinicTopBar.visible { display:flex; }
      #clinicTopBar .name { font-size:16px; font-weight:700; }
      #clinicTopBar .tag { font-size:12px; opacity:.85; }
      #clinicTopBar button { background:rgba(255,255,255,.2); color:#fff; border:none; padding:6px 14px; border-radius:8px; font-size:12px; cursor:pointer; font-family:inherit; }

      #settingsSection { display:none; font-family:'Tajawal',system-ui,sans-serif; padding:16px; padding-bottom:100px; }
      #settingsSection.visible { display:block; }
      #settingsSection .s-card { background:#fff; border-radius:16px; padding:20px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
      #settingsSection .s-title { font-size:15px; font-weight:700; color:#0f766e; margin-bottom:12px; }
      #settingsSection .s-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #f1f5f9; }
      #settingsSection .s-row:last-child { border-bottom:none; }
      #settingsSection .s-label { font-size:13px; color:#64748b; }
      #settingsSection .s-value { font-size:14px; font-weight:600; color:#1e293b; }
      #settingsSection .s-btn { width:100%; padding:12px; border:none; border-radius:10px; font-size:15px; font-weight:600; font-family:inherit; cursor:pointer; margin-top:8px; }
      #settingsSection .s-btn-act { background:linear-gradient(135deg,#f59e0b,#d97706); color:#fff; }
      #settingsSection .s-btn-out { background:#fee2e2; color:#dc2626; }
      #settingsSection .s-btn-login { background:linear-gradient(135deg,#0f766e,#059669); color:#fff; }

      #settingsSection .act-fields input { width:100%; padding:10px 14px; border:2px solid #e2e8f0; border-radius:10px; font-size:14px; font-family:inherit; outline:none; margin-bottom:10px; box-sizing:border-box; }
      #settingsSection .act-fields input:focus { border-color:#0f766e; }
      #settingsSection .act-fields label { display:block; font-size:12px; font-weight:600; color:#64748b; margin-bottom:3px; }
      #settingsSection .act-err { color:#ef4444; font-size:13px; margin-top:6px; text-align:center; min-height:18px; }
      #settingsSection .act-ok { color:#059669; font-size:13px; margin-top:6px; text-align:center; font-weight:600; }

      #activateModal { display:none; position:fixed; inset:0; z-index:100000; background:rgba(0,0,0,.5); align-items:center; justify-content:center; padding:20px; }
      #activateModal .act-card { background:#fff; border-radius:20px; padding:28px; width:min(420px,95vw); max-height:85vh; overflow-y:auto; box-shadow:0 8px 32px rgba(0,0,0,.2); font-family:'Tajawal',system-ui,sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- شريط اسم العيادة -->
    <div id="clinicTopBar">
      <div><div class="name" id="barName"></div><div class="tag" id="barTag"></div></div>
      <button onclick="deactivate()">خروج</button>
    </div>

    <!-- نافذة التنشيط -->
    <div id="activateModal">
      <div class="act-card" onclick="event.stopPropagation()">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <h2 style="font-size:20px;font-weight:700;color:#0f766e;margin:0">🔑 تفعيل العيادة</h2>
          <button onclick="closeActivate()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#64748b">✕</button>
        </div>
        <div style="font-size:13px;color:#64748b;margin-bottom:16px">أدخل كود التفعيل الذي تلقيته من إدارة دوري</div>
        <div style="margin-bottom:12px">
          <label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:4px">كود التفعيل</label>
          <input id="actCode" style="width:100%;padding:10px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:15px;font-family:inherit;outline:none;text-align:center;letter-spacing:2px" placeholder="A4F4D3-A6BEB5"/>
        </div>
        <div style="margin-bottom:12px">
          <label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:4px">اسم العيادة</label>
          <input id="actName" style="width:100%;padding:10px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:15px;font-family:inherit;outline:none" placeholder="عيادة الشفاء الطبية"/>
        </div>
        <div style="margin-bottom:12px">
          <label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:4px">الشعار (اختياري)</label>
          <input id="actTag" style="width:100%;padding:10px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:15px;font-family:inherit;outline:none" placeholder="صحتك أولوية"/>
        </div>
        <div style="margin-bottom:12px">
          <label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:4px">كلمة المرور (4+ حروف)</label>
          <input id="actPass" type="password" style="width:100%;padding:10px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:15px;font-family:inherit;outline:none" placeholder="اختر كلمة مرور"/>
        </div>
        <div style="margin-bottom:16px">
          <label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:4px">تأكيد كلمة المرور</label>
          <input id="actPass2" type="password" style="width:100%;padding:10px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:15px;font-family:inherit;outline:none" placeholder="أعد إدخال كلمة المرور"/>
        </div>
        <button onclick="doActivate()" style="width:100%;padding:12px;background:linear-gradient(135deg,#0f766e,#059669);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer">✅ تفعيل</button>
        <div id="actErr" class="act-err"></div>
        <div id="actOk" class="act-ok"></div>
      </div>
    </div>

    <!-- قسم الإعدادات (يُحقن داخل React بعد التحميل) -->
    <div id="settingsSection">
      <div class="s-card">
        <div class="s-title">⚙️ إعدادات العيادة</div>
        <div id="settingsContent"></div>
      </div>
    </div>

    <script type="module">
      const API = location.origin + '/api';
      const topBar = document.getElementById('clinicTopBar');
      const modal = document.getElementById('activateModal');
      const settingsSection = document.getElementById('settingsSection');
      const settingsContent = document.getElementById('settingsContent');

      const clinicToken = localStorage.getItem('clinicToken');
      const clinicId = localStorage.getItem('clinicId');
      const clinicName = localStorage.getItem('clinicName');

      const isActivated = !!(clinicToken && clinicId && clinicName);

      if (isActivated) {
        showTopBar(clinicName, localStorage.getItem('clinicTagline') || '');
        interceptFetch(clinicToken);
        renderSettingsActivated();
      } else {
        renderSettingsNotActivated();
      }

      /* ── حقن قسم الإعدادات في DOM بعد تحميل React ── */
      injectSettings();
      function injectSettings() {
        const root = document.getElementById('root');
        if (!root) { setTimeout(injectSettings, 500); return; }
        const observer = new MutationObserver(() => {
          const main = root.querySelector('main, [class*="pb-"], [class*="pt-"]') || root.children[0];
          if (main && main.children.length > 0) {
            observer.disconnect();
            const spacer = document.createElement('div');
            spacer.style.height = '80px';
            main.appendChild(spacer);
            main.appendChild(settingsSection);
            settingsSection.classList.add('visible');
          }
        });
        observer.observe(root, { childList: true, subtree: true });
        /* fallback */
        setTimeout(() => {
          if (!settingsSection.classList.contains('visible')) {
            root.appendChild(settingsSection);
            settingsSection.classList.add('visible');
          }
        }, 4000);
      }

      function renderSettingsNotActivated() {
        settingsContent.innerHTML = `
          <div style="text-align:center;padding:20px 0">
            <div style="font-size:40px;margin-bottom:8px">🔑</div>
            <div style="font-size:15px;font-weight:600;color:#1e293b;margin-bottom:4px">العيادة غير مُفعّلة</div>
            <div style="font-size:13px;color:#64748b;margin-bottom:16px">أدخل كود التفعيل لتبدأ استخدام اللوحة</div>
            <button id="settingsActBtn" class="s-btn s-btn-act">تفعيل العيادة</button>
          </div>
        `;
        document.getElementById('settingsActBtn').onclick = openActivate;
      }

      function renderSettingsActivated() {
        const tagline = localStorage.getItem('clinicTagline') || '';
        settingsContent.innerHTML = `
          <div class="s-row"><span class="s-label">اسم العيادة</span><span class="s-value">${clinicName}</span></div>
          ${tagline ? `<div class="s-row"><span class="s-label">الشعار</span><span class="s-value">${tagline}</span></div>` : ''}
          <div class="s-row"><span class="s-label">الحالة</span><span class="s-value" style="color:#059669">✅ مُفعّلة</span></div>
          <button id="settingsActBtn" class="s-btn s-btn-login" style="margin-top:12px">🔄 تحديث</button>
          <button id="settingsOutBtn" class="s-btn s-btn-out" style="margin-top:8px">تسجيل الخروج وتعطيل</button>
        `;
        document.getElementById('settingsActBtn').onclick = () => location.reload();
        document.getElementById('settingsOutBtn').onclick = deactivate;
      }

      /* ── Top Bar ── */
      function showTopBar(name, tag) {
        document.getElementById('barName').textContent = name;
        document.getElementById('barTag').textContent = tag;
        topBar.classList.add('visible');
        document.body.style.paddingTop = '52px';
      }

      /* ── Intercept Fetch ── */
      function interceptFetch(token) {
        const origFetch = window.fetch;
        window.fetch = function(url, opts = {}) {
          if (typeof url === 'string' && url.startsWith('/api/')) {
            opts.headers = { ...opts.headers, 'Authorization': 'Bearer ' + token };
          }
          return origFetch.call(this, url, opts);
        };
      }

      /* ── Activation Modal ── */
      window.openActivate = function() { modal.style.display = 'flex'; };
      window.closeActivate = function() { modal.style.display = 'none'; };
      modal.addEventListener('click', function(e) { if (e.target === this) closeActivate(); });

      window.doActivate = async function() {
        const code = document.getElementById('actCode').value.trim();
        const name = document.getElementById('actName').value.trim();
        const tag = document.getElementById('actTag').value.trim();
        const pass = document.getElementById('actPass').value;
        const pass2 = document.getElementById('actPass2').value;
        const errEl = document.getElementById('actErr');
        const okEl = document.getElementById('actOk');

        if (!code) { errEl.textContent = 'كود التفعيل مطلوب'; return; }
        if (!name) { errEl.textContent = 'اسم العيادة مطلوب'; return; }
        if (pass.length < 4) { errEl.textContent = 'كلمة المرور 4+ حروف'; return; }
        if (pass !== pass2) { errEl.textContent = 'كلمتا المرور غير متطابقتين'; return; }

        try {
          const r = await fetch(API + '/clinic/activate', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ activationCode: code, password: pass, clinicName: name, tagline: tag }),
          });
          const d = await r.json();
          if (!r.ok) { errEl.textContent = d.error; return; }

          localStorage.setItem('clinicToken', d.token);
          localStorage.setItem('clinicId', d.clinicId);
          localStorage.setItem('clinicName', d.name || name);
          localStorage.setItem('clinicTagline', tag);

          okEl.textContent = '✅ تم التفعيل! جاري التحديث...';
          errEl.textContent = '';
          setTimeout(() => { location.reload(); }, 1000);
        } catch { errEl.textContent = 'خطأ في الاتصال بالسيرفر'; }
      };

      window.deactivate = function() {
        localStorage.removeItem('clinicToken');
        localStorage.removeItem('clinicId');
        localStorage.removeItem('clinicName');
        localStorage.removeItem('clinicTagline');
        location.reload();
      };

      document.getElementById('actPass2')?.addEventListener('keydown', e => { if (e.key === 'Enter') doActivate(); });
    </script>
  </body>
</html>
