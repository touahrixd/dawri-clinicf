<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>لوحة دوري — إدارة الأدوار للعيادة</title>
    <meta name="description" content="نظام إدارة أدوار المرضى للعيادات" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/assets/index-egIjzhA5.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CyGRkLFq.css">
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      body{font-family:'Tajawal',system-ui,sans-serif}

      #clinicTopBar{display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:linear-gradient(135deg,#0f766e,#059669);color:#fff;padding:10px 20px;align-items:center;justify-content:space-between}
      #clinicTopBar.visible{display:flex}
      #clinicTopBar .name{font-size:16px;font-weight:700}
      #clinicTopBar .tag{font-size:12px;opacity:.85}
      #clinicTopBar button{background:rgba(255,255,255,.2);color:#fff;border:none;padding:6px 14px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit}

      #settingsDrawer{position:fixed;bottom:0;left:0;right:0;z-index:9998;background:#fff;border-top-left-radius:20px;border-top-right-radius:20px;box-shadow:0 -4px 24px rgba(0,0,0,.12);transition:transform .3s ease;max-height:70vh;overflow-y:auto}
      #settingsDrawer.closed{transform:translateY(calc(100% - 60px))}
      #settingsDrawer.open{transform:translateY(0)}
      #drawerHandle{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px 20px;cursor:pointer;user-select:none}
      #drawerHandle .icon{font-size:18px}
      #drawerHandle .text{font-size:14px;font-weight:600;color:#64748b}
      #drawerHandle .arrow{margin-right:auto;transition:transform .3s;color:#94a3b8;font-size:14px}
      #settingsDrawer.open #drawerHandle .arrow{transform:rotate(180deg)}
      #drawerBody{padding:0 20px 24px}
      .s-card{background:#f8fafc;border-radius:14px;padding:16px;margin-bottom:10px}
      .s-title{font-size:14px;font-weight:700;color:#0f766e;margin-bottom:10px}
      .s-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #e2e8f0}
      .s-row:last-child{border-bottom:none}
      .s-label{font-size:13px;color:#64748b}
      .s-value{font-size:13px;font-weight:600;color:#1e293b}
      .s-btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:8px}
      .s-btn-act{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
      .s-btn-out{background:#fee2e2;color:#dc2626}
      .s-btn-reload{background:linear-gradient(135deg,#0f766e,#059669);color:#fff}
      .s-act-icon{text-align:center;font-size:40px;margin-bottom:8px}
      .s-act-title{font-size:15px;font-weight:600;color:#1e293b;text-align:center;margin-bottom:4px}
      .s-act-sub{font-size:13px;color:#64748b;text-align:center;margin-bottom:14px}

      #activateModal{display:none;position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:20px}
      .act-card{background:#fff;border-radius:20px;padding:28px;width:min(420px,95vw);max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
      .act-card h2{font-size:20px;font-weight:700;color:#0f766e;margin:0 0 16px}
      .act-fields label{display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:3px}
      .act-fields input{width:100%;padding:10px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:14px;font-family:inherit;outline:none;margin-bottom:10px}
      .act-fields input:focus{border-color:#0f766e}
      .act-btn{width:100%;padding:12px;background:linear-gradient(135deg,#0f766e,#059669);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
      .act-close{background:none;border:none;font-size:24px;cursor:pointer;color:#64748b;float:left}
      .act-err{color:#ef4444;font-size:13px;margin-top:6px;text-align:center;min-height:18px}
      .act-ok{color:#059669;font-size:13px;margin-top:6px;text-align:center;font-weight:600}
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- شريط العيادة -->
    <div id="clinicTopBar">
      <div><div class="name" id="barName"></div><div class="tag" id="barTag"></div></div>
      <button id="barLogout">خروج</button>
    </div>

    <!-- نافذة التنشيط -->
    <div id="activateModal">
      <div class="act-card" onclick="event.stopPropagation()">
        <button class="act-close" onclick="closeActivate()">✕</button>
        <h2>🔑 تفعيل العيادة</h2>
        <div class="act-fields">
          <label>كود التفعيل</label>
          <input id="actCode" style="text-align:center;letter-spacing:2px" placeholder="A4F4D3-A6BEB5"/>
          <label>اسم العيادة</label>
          <input id="actName" placeholder="عيادة الشفاء الطبية"/>
          <label>الشعار (اختياري)</label>
          <input id="actTag" placeholder="صحتك أولوية"/>
          <label>كلمة المرور (4+ حروف)</label>
          <input id="actPass" type="password" placeholder="اختر كلمة مرور"/>
          <label>تأكيد كلمة المرور</label>
          <input id="actPass2" type="password" placeholder="أعد إدخال كلمة المرور"/>
        </div>
        <button class="act-btn" onclick="doActivate()">✅ تفعيل</button>
        <div id="actErr" class="act-err"></div>
        <div id="actOk" class="act-ok"></div>
      </div>
    </div>

    <!-- لوحة الإعدادات (ثابتة في الأسفل) -->
    <div id="settingsDrawer" class="closed">
      <div id="drawerHandle">
        <span class="arrow">▲</span>
        <span class="icon">⚙️</span>
        <span class="text">الإعدادات</span>
      </div>
      <div id="drawerBody"></div>
    </div>

    <script type="module">
      const API = location.origin + '/api';
      const topBar = document.getElementById('clinicTopBar');
      const modal = document.getElementById('activateModal');
      const drawer = document.getElementById('settingsDrawer');
      const drawerBody = document.getElementById('drawerBody');

      const clinicToken = localStorage.getItem('clinicToken');
      const clinicId = localStorage.getItem('clinicId');
      const clinicName = localStorage.getItem('clinicName');
      const isActivated = !!(clinicToken && clinicId && clinicName);

      /* ── Top Bar ── */
      if (isActivated) {
        showTopBar(clinicName, localStorage.getItem('clinicTagline') || '');
        interceptFetch(clinicToken);
      }

      function showTopBar(name, tag) {
        document.getElementById('barName').textContent = name;
        document.getElementById('barTag').textContent = tag;
        topBar.classList.add('visible');
        document.body.style.paddingTop = '52px';
      }

      /* ── Intercept Fetch ── */
      function interceptFetch(token) {
        const origFetch = window.fetch;
        window.fetch = function(url, opts = {}) {
          if (typeof url === 'string' && url.startsWith('/api/')) {
            opts.headers = { ...opts.headers, 'Authorization': 'Bearer ' + token };
          }
          return origFetch.call(this, url, opts);
        };
      }

      /* ── Drawer Toggle ── */
      document.getElementById('drawerHandle').onclick = () => {
        drawer.classList.toggle('open');
        drawer.classList.toggle('closed');
      };

      /* ── Render Settings ── */
      if (isActivated) {
        const tagline = localStorage.getItem('clinicTagline') || '';
        drawerBody.innerHTML = `
          <div class="s-card">
            <div class="s-title">⚙️ معلومات العيادة</div>
            <div class="s-row"><span class="s-label">الاسم</span><span class="s-value">${clinicName}</span></div>
            ${tagline ? `<div class="s-row"><span class="s-label">الشعار</span><span class="s-value">${tagline}</span></div>` : ''}
            <div class="s-row"><span class="s-label">الحالة</span><span class="s-value" style="color:#059669">✅ مُفعّلة</span></div>
            <button class="s-btn s-btn-reload" onclick="location.reload()">🔄 تحديث</button>
            <button class="s-btn s-btn-out" id="logoutBtn" style="margin-top:8px">تسجيل الخروج وتعطيل</button>
          </div>
        `;
        document.getElementById('logoutBtn').onclick = deactivate;
      } else {
        drawerBody.innerHTML = `
          <div class="s-card" style="text-align:center;padding:20px">
            <div class="s-act-icon">🔑</div>
            <div class="s-act-title">العيادة غير مُفعّلة</div>
            <div class="s-act-sub">أدخل كود التفعيل لتبدأ استخدام اللوحة</div>
            <button class="s-btn s-btn-act" id="settingsActBtn">تفعيل العيادة</button>
          </div>
        `;
        document.getElementById('settingsActBtn').onclick = openActivate;
        /* فتح الإعدادات تلقائياً إذا لم تُفعّل */
        setTimeout(() => { drawer.classList.remove('closed'); drawer.classList.add('open'); }, 1500);
      }

      /* ── Activation Modal ── */
      window.openActivate = function() { modal.style.display = 'flex'; };
      window.closeActivate = function() { modal.style.display = 'none'; };
      modal.addEventListener('click', function(e) { if (e.target === this) closeActivate(); });

      window.doActivate = async function() {
        const code = document.getElementById('actCode').value.trim();
        const name = document.getElementById('actName').value.trim();
        const tag = document.getElementById('actTag').value.trim();
        const pass = document.getElementById('actPass').value;
        const pass2 = document.getElementById('actPass2').value;
        const errEl = document.getElementById('actErr');
        const okEl = document.getElementById('actOk');

        if (!code) { errEl.textContent = 'كود التفعيل مطلوب'; return; }
        if (!name) { errEl.textContent = 'اسم العيادة مطلوب'; return; }
        if (pass.length < 4) { errEl.textContent = 'كلمة المرور 4+ حروف'; return; }
        if (pass !== pass2) { errEl.textContent = 'كلمتا المرور غير متطابقتين'; return; }

        try {
          const r = await fetch(API + '/clinic/activate', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ activationCode: code, password: pass, clinicName: name, tagline: tag }),
          });
          const d = await r.json();
          if (!r.ok) { errEl.textContent = d.error; return; }

          localStorage.setItem('clinicToken', d.token);
          localStorage.setItem('clinicId', d.clinicId);
          localStorage.setItem('clinicName', d.name || name);
          localStorage.setItem('clinicTagline', tag);

          okEl.textContent = '✅ تم التفعيل! جاري التحديث...';
          errEl.textContent = '';
          setTimeout(() => { location.reload(); }, 1000);
        } catch { errEl.textContent = 'خطأ في الاتصال بالسيرفر'; }
      };

      window.deactivate = function() {
        localStorage.removeItem('clinicToken');
        localStorage.removeItem('clinicId');
        localStorage.removeItem('clinicName');
        localStorage.removeItem('clinicTagline');
        location.reload();
      };

      document.getElementById('barLogout').onclick = deactivate;
      document.getElementById('actPass2')?.addEventListener('keydown', e => { if (e.key === 'Enter') doActivate(); });
    </script>
  </body>
</html>
